# Configuration SonarQube pour Ultimate Mahjong Connect
sonar.projectKey=ultimate-mahjong-connect
sonar.projectName=Ultimate Mahjong Connect
sonar.projectVersion=1.0

# Sources et exclusions
sonar.sources=.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/wwwroot/lib/**,**/*.min.js,**/*.min.css

# Configuration .NET
sonar.cs.opencover.reportsPaths=coverage.opencover.xml
sonar.cs.vstest.reportsPaths=TestResults/*.trx

# Règles de sécurité renforcées
sonar.security.hotspots.enabled=true

# Qualité du code
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/*Tests.cs,**/Migrations/**

# Seuils de qualité
sonar.qualitygate.wait=true
